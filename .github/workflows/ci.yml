name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/package-smoke.mjs
        env:
          npm_config_cache: /home/runner/.npm
      - name: Build and dry-run with Node.js permission restrictions
        if: matrix.node == 24
        run: npm run bank:check
        env:
          # Keep native addons and worker threads disabled.
          NODE_OPTIONS: >-
            --permission --allow-child-process --allow-fs-read=*
            --allow-fs-write=${{ github.workspace }}/*
          # Synthetic key for the OpenRouter fixture's config validation only.
          # bank:check uses --dry-run: no provider requests or real secrets are needed.
          OPENROUTER_API_KEY: synthetic-dry-run
          LOGITPING_BANK_CONFIG: tests/fixtures/bank-dry-run.json
